[platformio]
default_envs = esp32-s3-cam-ov5640

[env]
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = arduino
upload_port = COM8
monitor_port = COM8
monitor_speed = 115200

board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv 
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi 

; Assistant graphics are embedded; uploading a filesystem image is unnecessary.
board_build.filesystem = littlefs

lib_deps = 
    bodmer/TFT_eSPI@2.5.43
    bodmer/TJpg_Decoder@1.1.0

build_flags = 
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D USER_SETUP_LOADED=1
    -D ILI9341_DRIVER=1
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D TOUCH_CS=-1

; Same N16R8 board/pins; sensor replaced with OV5640 AF, 2026-11-02.
[env:esp32-s3-cam-ov5640]
build_flags =
    ${env.build_flags}
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=1000000
    -D VIETOCR_CAMERA=1
    -D CAM_PWDN=-1
    -D ASSISTANT_BUZZER_PIN=14
    ; TFT_eSPI 2.5.43 aliases -1 to MOSI on ESP32-S3; use a separate pin.
    -D TFT_MISO=39
    -D TFT_MOSI=21
    -D TFT_SCLK=47
    -D TFT_CS=42
    -D TFT_DC=41
    -D TFT_RST=40
