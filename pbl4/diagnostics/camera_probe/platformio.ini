[platformio]
default_envs = probe-uart

[env]
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
build_flags =
    -D BOARD_HAS_PSRAM
    -D CORE_DEBUG_LEVEL=3

; USB-UART bridge (TX/RX LEDs): serial port survives ESP32 restarts.
[env:probe-uart]
build_flags =
    ${env.build_flags}
    -D ARDUINO_USB_CDC_ON_BOOT=0

; Optional second build for the board's Native USB/OTG socket.
[env:probe-native-usb]
build_flags =
    ${env.build_flags}
    -D ARDUINO_USB_CDC_ON_BOOT=1
