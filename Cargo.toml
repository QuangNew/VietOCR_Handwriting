[workspace]
members = ["shared/contracts/rust", "services/gateway", "shared/client-core"]
exclude = ["apps/desktop/src-tauri"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.88"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.50", features = ["macros", "rt-multi-thread", "net", "sync", "time", "signal", "fs", "io-util"] }
bytes = "1.11"
futures-util = "0.3.32"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "json", "stream"] }
uuid = { version = "1.22", features = ["serde", "v4"] }
sha2 = "0.11.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

