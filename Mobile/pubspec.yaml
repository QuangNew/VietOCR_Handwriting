name: vietocr_mobile
description: VietOCR Handwriting offline, with a Bluetooth desk assistant.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.7
  flutter_onnxruntime: ^1.9.0
  flutter_reactive_ble: ^5.5.0
  image: ^4.12.0
  image_picker: ^1.2.4
  path_provider: ^2.1.5
  # Newer Android implementations require AGP 9; Flutter 3.41 uses AGP 8.
  permission_handler: 12.0.1
  share_plus: ^13.3.1
  shared_preferences: ^2.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/samples/
