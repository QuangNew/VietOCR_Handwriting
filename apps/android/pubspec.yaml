name: vietocr_mobile
description: VietOCR Raspberry gateway client with Google login and private image drafts.
publish_to: none
version: 4.1.0+21

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.8
  image: ^4.13.1
  image_picker: ^1.2.4
  path_provider: ^2.1.5
  share_plus: ^13.3.1
  shared_preferences: ^2.5.4
  supabase_flutter: ^2.18.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/config/
