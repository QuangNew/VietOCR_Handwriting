# Named tunnel connector running ON the Windows inference host.
tunnel: REPLACE_COMPUTE_TUNNEL_UUID
credentials-file: C:/ProgramData/cloudflared/REPLACE_COMPUTE_TUNNEL_UUID.json
ingress:
  - hostname: ocr.quangnew.tech
    path: ^/api/internal/v2/.*$
    service: http://127.0.0.1:5080
  - hostname: ocr.quangnew.tech
    path: ^/api/v2/results/.*$
    service: http://127.0.0.1:5080
  - service: http_status:404
