# Named tunnel connector running ON Raspberry. Credentials never enter Git.
tunnel: REPLACE_PI_TUNNEL_UUID
credentials-file: /etc/cloudflared/REPLACE_PI_TUNNEL_UUID.json
ingress:
  - hostname: api.quangnew.tech
    service: http://127.0.0.1:5082
    originRequest:
      connectTimeout: 10s
      tcpKeepAlive: 30s
  - service: http_status:404
