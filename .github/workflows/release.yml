name: Release Desktop & Android

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-desktop:
    name: Desktop Windows (x64)
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Rust 1.94.0
        run: rustup toolchain install 1.94.0 --profile minimal --component rustfmt,clippy
      - name: Verify Desktop config & UI unit tests
        run: node --test apps/desktop/tests/*.test.mjs
      - name: Check Desktop Rust formatting
        working-directory: apps/desktop/src-tauri
        run: cargo +1.94.0 fmt --check
      - name: Check Desktop Rust lints
        working-directory: apps/desktop/src-tauri
        run: cargo +1.94.0 clippy --all-targets --locked -- -D warnings
      - name: Build Windows Desktop release binary
        working-directory: apps/desktop/src-tauri
        run: cargo +1.94.0 build --release --locked
      - name: Stage Desktop release asset and SHA-256
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "dev-$($env:GITHUB_SHA.Substring(0,7))" }
          $outDir = Join-Path (Get-Location) "release-desktop"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $exeName = "VietHandOCR-Desktop-$tag-windows-x64.exe"
          $exePath = Join-Path $outDir $exeName
          Copy-Item "apps/desktop/src-tauri/target/release/vietocr-desktop.exe" $exePath
          $hash = (Get-FileHash $exePath -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText("${exePath}.sha256", "$hash  $exeName`n")
      - uses: actions/upload-artifact@v4
        with:
          name: release-desktop
          path: release-desktop/*
          retention-days: 7
          if-no-files-found: error

  build-android:
    name: Android APK (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify shared client public config
        run: node --test apps/desktop/tests/client-config.test.mjs
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter 3.41.4
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: stable
          cache: true
      - name: Fetch Android dependencies
        working-directory: apps/android
        run: flutter pub get
      - name: Analyze Android code
        working-directory: apps/android
        run: flutter analyze --no-pub
      - name: Run Android tests
        working-directory: apps/android
        run: flutter test --no-pub --concurrency=1
      - name: Build Android arm64 release APK
        working-directory: apps/android
        run: flutter build apk --release --target-platform android-arm64
      - name: Stage Android release asset and SHA-256
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="dev-${GITHUB_SHA:0:7}"
          fi
          mkdir -p release-android
          APK_NAME="VietHandOCR-Android-${TAG}-arm64.apk"
          cp apps/android/build/app/outputs/flutter-apk/app-release.apk "release-android/${APK_NAME}"
          (cd release-android && sha256sum "${APK_NAME}" > "${APK_NAME}.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: release-android/*
          retention-days: 7
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [build-desktop, build-android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Prepare combined checksums and release notes
        run: |
          TAG="${GITHUB_REF_NAME}"
          cd release-assets
          cat *.sha256 > SHA256SUMS.txt
          DESKTOP_FILE=$(ls VietHandOCR-Desktop-*.exe)
          ANDROID_FILE=$(ls VietHandOCR-Android-*.apk)
          cat <<EOF > ../release-notes.md
          ## VietHandOCR ${TAG}

          Bản phát hành chính thức ứng dụng **Windows Desktop** và **Android** cho hệ thống nhận dạng chữ viết tay tiếng Việt **VietHandOCR** (\`Native + ML_s44 + Bartpho_v2_fp16\`).

          ### Tệp cài đặt
          - **Windows Desktop (x64):** \`${DESKTOP_FILE}\` — tải về và chạy trực tiếp (Windows 10/11 với WebView2 Runtime).
          - **Android (arm64-v8a):** \`${ANDROID_FILE}\` — cài trực tiếp trên thiết bị Android 8.0+ (cho phép cài từ nguồn không xác định).

          ### Hướng dẫn nhanh
          1. Mở ứng dụng và nhập địa chỉ HTTPS của **Raspberry Pi Gateway**.
          2. Đăng nhập bằng tài khoản **Google**.
          3. Chụp ảnh từ webcam Raspberry Pi hoặc chọn ảnh từ thiết bị; tùy chọn bật **Nội suy sửa lỗi (BARTpho)** trước khi gửi OCR.

          ### Kiểm tra toàn vẹn (SHA-256)
          \`\`\`text
          $(cat SHA256SUMS.txt)
          \`\`\`
          EOF
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${TAG}" release-assets/* --repo "${GITHUB_REPOSITORY}" --clobber
            gh release edit "${TAG}" --repo "${GITHUB_REPOSITORY}" --title "VietHandOCR ${TAG}" --notes-file release-notes.md
          else
            gh release create "${TAG}" release-assets/* \
              --repo "${GITHUB_REPOSITORY}" \
              --title "VietHandOCR ${TAG}" \
              --notes-file release-notes.md \
              --verify-tag
          fi
