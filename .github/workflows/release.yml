name: Release Desktop & Android

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-desktop:
    name: Desktop Windows (x64)
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust 1.94.0
        run: rustup toolchain install 1.94.0 --profile minimal --component rustfmt,clippy
      - name: Verify Desktop config & UI unit tests
        run: node --test apps/desktop/tests/*.test.mjs
      - name: Check Desktop Rust formatting
        working-directory: apps/desktop/src-tauri
        run: cargo +1.94.0 fmt --check
      - name: Check Desktop Rust lints
        working-directory: apps/desktop/src-tauri
        run: cargo +1.94.0 clippy --all-targets --locked -- -D warnings
      - name: Build Windows Desktop release binary
        working-directory: apps/desktop/src-tauri
        run: cargo +1.94.0 build --release --locked
      - name: Stage Desktop release asset and SHA-256
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "dev-$($env:GITHUB_SHA.Substring(0,7))" }
          $outDir = Join-Path (Get-Location) "release-desktop"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $exeName = "VietHandOCR-Desktop-$tag-windows-x64.exe"
          $exePath = Join-Path $outDir $exeName
          Copy-Item "apps/desktop/src-tauri/target/release/vietocr-desktop.exe" $exePath
          $hash = (Get-FileHash $exePath -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText("${exePath}.sha256", "$hash  $exeName`n")
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-desktop
          path: release-desktop/*
          retention-days: 7
          if-no-files-found: error

  build-android:
    name: Android APK (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify shared client public config
        run: node --test apps/desktop/tests/client-config.test.mjs
      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter 3.41.4
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.41.4'
          channel: stable
          cache: true
      - name: Fetch Android dependencies
        working-directory: apps/android
        run: flutter pub get
      - name: Analyze Android code
        working-directory: apps/android
        run: flutter analyze --no-pub
      - name: Run Android tests
        working-directory: apps/android
        run: flutter test --no-pub --concurrency=1
      - name: Build Android arm64 release APK
        working-directory: apps/android
        run: flutter build apk --release --target-platform android-arm64
      - name: Stage Android release asset and SHA-256
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="dev-${GITHUB_SHA:0:7}"
          fi
          mkdir -p release-android
          APK_NAME="VietHandOCR-Android-${TAG}-arm64.apk"
          cp apps/android/build/app/outputs/flutter-apk/app-release.apk "release-android/${APK_NAME}"
          (cd release-android && sha256sum "${APK_NAME}" > "${APK_NAME}.sha256")
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-android
          path: release-android/*
          retention-days: 7
          if-no-files-found: error

  build-gateway:
    name: Raspberry Pi Gateway (linux-arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust 1.94.0
        run: rustup toolchain install 1.94.0 --profile minimal --component rustfmt,clippy
      - name: Verify Rust workspace formatting, tests, and lints
        run: |
          cargo +1.94.0 fmt --all --check
          cargo +1.94.0 test --workspace --locked
          cargo +1.94.0 clippy --workspace --all-targets --locked -- -D warnings
      - name: Build ARM64 gateway release binary
        run: |
          cargo +1.94.0 build --release --locked -p vietocr-gateway
          cargo +1.94.0 build --release --locked -p vietocr-gateway --example camera_probe
          cargo +1.94.0 build --release --locked -p vietocr-gateway --example admission_probe
      - name: Stage ARM64 gateway bundle and SHA-256
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="dev-${GITHUB_SHA:0:7}"
          fi
          mkdir -p bundle release-gateway
          cp target/release/vietocr-gateway services/gateway/config.example.json services/gateway/README.md bundle/
          cp target/release/examples/camera_probe bundle/
          cp target/release/examples/admission_probe bundle/
          cp -r infra/raspberry bundle/
          ARCHIVE="VietHandOCR-Gateway-${TAG}-linux-arm64.tar.gz"
          tar -czf "release-gateway/${ARCHIVE}" -C bundle .
          (cd release-gateway && sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256")
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-gateway
          path: release-gateway/*
          retention-days: 7
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [build-desktop, build-android, build-gateway]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-assets
          merge-multiple: true
      - name: Prepare combined checksums and release notes
        run: |
          TAG="${GITHUB_REF_NAME}"
          cd release-assets
          cat *.sha256 > SHA256SUMS.txt
          DESKTOP_FILE=$(ls VietHandOCR-Desktop-*.exe)
          ANDROID_FILE=$(ls VietHandOCR-Android-*.apk)
          GATEWAY_FILE=$(ls VietHandOCR-Gateway-*.tar.gz)
          cat <<EOF > ../release-notes.md
          ## VietHandOCR ${TAG}

          Bản phát hành chính thức ứng dụng **Windows Desktop**, **Android** và **Raspberry Pi Gateway (ARM64)** cho hệ thống nhận dạng chữ viết tay tiếng Việt **VietHandOCR** (\`Native + ML_s44 + Bartpho_v2_fp16\`).

          ### Tệp cài đặt
          - **Windows Desktop (x64):** \`${DESKTOP_FILE}\` — tải về và chạy trực tiếp (Windows 10/11 với WebView2 Runtime).
          - **Android (arm64-v8a):** \`${ANDROID_FILE}\` — cài trực tiếp trên thiết bị Android 8.0+ (cho phép cài từ nguồn không xác định).
          - **Raspberry Pi 4B Gateway (linux-arm64):** \`${GATEWAY_FILE}\` — giải nén và cài bằng \`infra/raspberry/install.sh\`.

          ### Hướng dẫn nhanh
          1. Mở ứng dụng và nhập địa chỉ HTTPS của **Raspberry Pi Gateway**.
          2. Đăng nhập bằng tài khoản **Google**.
          3. Chụp ảnh từ webcam Raspberry Pi hoặc chọn ảnh từ thiết bị; tùy chọn bật **Nội suy sửa lỗi (BARTpho)** trước khi gửi OCR.

          ### Kiểm tra toàn vẹn (SHA-256)
          \`\`\`text
          $(cat SHA256SUMS.txt)
          \`\`\`
          EOF
      - name: Create fresh GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          TITLE="VietHandOCR ${TAG}"
          for REL_ID in $(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"${TAG}\" or (.draft == true and .name == \"${TITLE}\")) | .id"); do
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${REL_ID}"
          done
          gh release create "${TAG}" release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${TITLE}" \
            --notes-file release-notes.md \
            --verify-tag
